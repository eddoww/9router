name: Homelab Verified Image

on:
  push:
    branches: [homelab]
  schedule:
    - cron: '2 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homelab-verified-image
  cancel-in-progress: false

jobs:
  verify-publish:
    if: github.repository == 'eddoww/9router'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/eddoww/9router
      UV_THREADPOOL_SIZE: '4'
      MAKEFLAGS: '-j4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: homelab
          fetch-depth: 0
      - name: Integrate upstream without rewriting local patches
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'Edwin de Jong'
          git config user.email 'vevionez@protonmail.com'
          git remote add upstream https://github.com/decolua/9router.git
          git fetch --no-tags upstream master
          # A conflict fails this job and leaves the deployed image unchanged.
          git merge --no-edit upstream/master
          commit=$(git rev-parse HEAD)
          upstream=$(git rev-parse upstream/master)
          tag="homelab-$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Never rebuild or replace a previously verified source release.
          if test "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)" = false; then
            gh release download "$tag" --pattern homelab-image.json --dir "$RUNNER_TEMP/verified-existing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Verified release $tag already exists." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install regression dependencies
        if: steps.source.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install test and application packages
        if: steps.source.outputs.skip != 'true'
        run: |
          nice -n 19 npm install --prefix tests --ignore-scripts --no-audit --no-fund
          nice -n 19 npm install --ignore-scripts --no-audit --no-fund
      - name: Verify local patches
        if: steps.source.outputs.skip != 'true'
        run: bash homelab/test.sh
      - name: Configure bounded container builder
        if: steps.source.outputs.skip != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Build candidate
        if: steps.source.outputs.skip != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ghcr.io/eddoww/9router:sha-${{ steps.source.outputs.commit }}
          build-args: APP_VERSION=homelab-${{ steps.source.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/eddoww/9router
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
          cache-from: type=gha,scope=homelab-amd64
          cache-to: type=gha,mode=max,scope=homelab-amd64
          provenance: false
      - name: Verify candidate container
        if: steps.source.outputs.skip != 'true'
        run: bash homelab/smoke.sh "$IMAGE:sha-${{ steps.source.outputs.commit }}"
      - name: Publish verified source and image
        if: steps.source.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          UPSTREAM_COMMIT: ${{ steps.source.outputs.upstream }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          # A concurrent branch update fails safely instead of overwriting it.
          git push origin HEAD:homelab
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --password-stdin
          nice -n 19 docker push "$IMAGE:sha-$SOURCE_COMMIT"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$SOURCE_COMMIT")
          export VERIFIED_IMAGE="$digest"
          python3 - <<'PY'
          import json, os, re
          image = os.environ["VERIFIED_IMAGE"]
          assert re.fullmatch(r"ghcr\.io/eddoww/9router@sha256:[0-9a-f]{64}", image)
          manifest = {
              "image": image,
              "source_commit": os.environ["SOURCE_COMMIT"],
              "upstream_commit": os.environ["UPSTREAM_COMMIT"],
              "build_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "workflow_run": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
          }
          with open("homelab-image.json", "w") as file:
              json.dump(manifest, file, indent=2)
              file.write("\n")
          with open("release-notes.txt", "w") as file:
              file.write("Verified upstream integration and local regression patches.\n\n")
              file.write("Source: " + manifest["source_commit"] + "\n")
              file.write("Upstream: " + manifest["upstream_commit"] + "\n")
              file.write("Image: " + manifest["image"] + "\n")
              file.write("Checks: focused regressions, container health and access controls.\n")
          PY
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" homelab-image.json --clobber
          else
            gh release create "$RELEASE_TAG" homelab-image.json --draft \
              --target "$SOURCE_COMMIT" --title "$RELEASE_TAG" --notes-file release-notes.txt
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
          cat homelab-image.json >> "$GITHUB_STEP_SUMMARY"
